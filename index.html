<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Platform — Civil Service Promotion Practice Exam</title>
<style>
:root{
  --ink:#132638; --muted:#5b6b78; --primary:#0e4d6b; --primary-600:#0b3e57;
  --accent:#e0a21a; --accent-soft:#fbf0d6;
  --bg:#eef2f5; --surface:#ffffff; --line:#d9e0e6; --line-soft:#e8edf1;
  --success:#1f7a54; --success-bg:#e4f3eb; --danger:#b23a3a; --danger-bg:#f8e8e8;
  --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(19,38,56,.06),0 6px 20px rgba(19,38,56,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:17px;line-height:1.5;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .4em;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:0 0 1rem} a{color:var(--primary)}
button{font-family:inherit;font-size:1rem;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--primary);color:#fff;display:flex;align-items:center;gap:1rem;
  padding:.7rem 1.1rem;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(11,62,87,.25)}
.topbar .brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.15rem}
.topbar .brand .mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--primary-600);
  display:grid;place-items:center;font-weight:800;font-size:.95rem}
.topbar .spacer{flex:1}
.topbar .who{font-size:.9rem;opacity:.95;text-align:right;line-height:1.25}
.topbar .who b{display:block;font-size:.98rem}
.btn{border:1px solid transparent;border-radius:var(--radius-sm);padding:.62rem 1.05rem;font-weight:600;
  background:var(--primary);color:#fff;transition:background .15s,transform .05s}
.btn:hover{background:var(--primary-600)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.sec{background:var(--surface);color:var(--primary);border-color:var(--line)}
.btn.sec:hover{background:#f3f7f9}
.btn.warn{background:var(--accent);color:#5b4409} .btn.warn:hover{filter:brightness(.96)}
.btn.danger{background:var(--danger)} .btn.danger:hover{filter:brightness(.94)}
.btn.sm{padding:.4rem .7rem;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:1.4rem 1.1rem 3rem}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:1.3rem;box-shadow:var(--shadow);margin-bottom:1.1rem}
.card h2{margin-top:0}
.grid{display:grid;gap:1.1rem}
.grid.cols2{grid-template-columns:repeat(2,1fr)}
.grid.cols3{grid-template-columns:repeat(3,1fr)}
.grid.cols4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.grid.cols2,.grid.cols3,.grid.cols4{grid-template-columns:1fr}}

/* Forms */
.field{margin-bottom:1rem}
.field label{display:block;font-weight:600;font-size:.92rem;margin-bottom:.35rem;color:var(--ink)}
.field .hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=password],input[type=number],input[type=email],select,textarea{
  width:100%;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(14,77,107,.15)}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:.8rem;flex-wrap:wrap}
.row>*{flex:1;min-width:180px}

/* Auth screen */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:1.2rem;
  background:linear-gradient(160deg,#0e4d6b 0%,#0b3e57 60%,#0a3247 100%)}
.auth-card{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  width:100%;max-width:430px;padding:2rem 1.8rem}
.auth-brand{display:flex;align-items:center;gap:.7rem;margin-bottom:.3rem}
.auth-brand .mark{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--primary-600);
  display:grid;place-items:center;font-weight:800;font-size:1.2rem}
.auth-brand .t{font-weight:800;font-size:1.35rem;color:var(--primary)}
.auth-sub{color:var(--muted);margin-bottom:1.5rem;font-size:.95rem}

/* Badges / pills */
.badge{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.78rem;font-weight:600;
  background:var(--accent-soft);color:#8a6608}
.badge.role-super{background:#e7ecf2;color:var(--primary-600)}
.badge.role-admin{background:#e3f0f5;color:var(--primary)}
.badge.role-user{background:var(--accent-soft);color:#8a6608}
.badge.ok{background:var(--success-bg);color:var(--success)}
.badge.bad{background:var(--danger-bg);color:var(--danger)}
.badge.lock{background:#eceff2;color:var(--muted)}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:.6rem .55rem;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{font-size:.8rem;color:var(--muted);font-weight:700}
tr:hover td{background:#fafcfd}
.table-wrap{overflow-x:auto}

/* Tabs */
.tabs{display:flex;gap:.3rem;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:1.2rem}
.tab{background:none;border:none;padding:.7rem 1rem;font-weight:600;color:var(--muted);
  border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--primary);border-bottom-color:var(--accent)}

/* Progress bar */
.progress{height:12px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.progress .fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));
  transition:width .5s ease}
.stat{text-align:center;padding:.4rem}
.stat .n{font-size:2rem;font-weight:800;color:var(--primary);line-height:1}
.stat .l{font-size:.82rem;color:var(--muted);margin-top:.3rem}

/* Bars for category analytics */
.catbar{display:grid;grid-template-columns:1fr;gap:.7rem}
.catbar .item{display:grid;grid-template-columns:190px 1fr 52px;align-items:center;gap:.7rem}
@media(max-width:640px){.catbar .item{grid-template-columns:130px 1fr 44px}}
.catbar .lab{font-size:.9rem;font-weight:600}
.catbar .track{height:14px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.catbar .bar{height:100%;border-radius:999px}
.catbar .pct{text-align:right;font-weight:700;font-size:.9rem}

/* Exam */
.exam-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.qpalette{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0 0}
.qdot{width:34px;height:34px;border-radius:7px;border:1.5px solid var(--line);background:#fff;
  font-size:.85rem;font-weight:700;color:var(--muted)}
.qdot.answered{background:var(--primary);color:#fff;border-color:var(--primary)}
.qdot.current{outline:3px solid var(--accent);outline-offset:1px}
.qstem{font-size:1.22rem;font-weight:600;margin:.2rem 0 1.1rem;line-height:1.45}
.opt{display:block;width:100%;text-align:left;padding:.85rem 1rem;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);background:#fff;margin-bottom:.6rem;font-size:1.02rem;transition:.12s}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:#eef6fa;box-shadow:0 0 0 2px rgba(14,77,107,.15)}
.opt.correct{border-color:var(--success);background:var(--success-bg)}
.opt.wrong{border-color:var(--danger);background:var(--danger-bg)}
.timer{font-weight:800;font-size:1.1rem;background:var(--accent-soft);color:#8a6608;
  padding:.3rem .8rem;border-radius:8px}
.timer.low{background:var(--danger-bg);color:var(--danger)}

/* drag-drop ordering */
.dnd{list-style:none;padding:0;margin:0}
.dnd li{padding:.8rem 1rem;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  background:#fff;margin-bottom:.55rem;display:flex;align-items:center;gap:.7rem;cursor:grab}
.dnd li.dragging{opacity:.5;border-style:dashed}
.dnd li .grip{color:var(--muted);font-size:1.2rem;cursor:grab}
.dnd li .num{width:26px;height:26px;border-radius:6px;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-size:.85rem;font-weight:700;flex:none}
.dnd .updown{margin-left:auto;display:flex;gap:.25rem}

/* matching */
.match-row{display:grid;grid-template-columns:1fr 220px;gap:.7rem;align-items:center;margin-bottom:.55rem}
@media(max-width:560px){.match-row{grid-template-columns:1fr}}
.match-row .left{padding:.75rem .9rem;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  background:#f7fafb;font-weight:600}

/* review */
.review-q{border:1.5px solid var(--line);border-radius:var(--radius);padding:1.1rem;margin-bottom:1rem}
.review-q.correct{border-left:5px solid var(--success)}
.review-q.wrong{border-left:5px solid var(--danger)}
.explain{background:#f3f8fb;border:1px solid var(--line);border-left:4px solid var(--primary);
  border-radius:8px;padding:.85rem 1rem;margin-top:.8rem;font-size:.98rem}
.explain b{color:var(--primary)}

/* toast + modal */
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:.8rem 1.3rem;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:100;
  font-weight:600;max-width:90vw}
.toast.ok{background:var(--success)} .toast.err{background:var(--danger)}
.modal-bg{position:fixed;inset:0;background:rgba(19,38,56,.55);display:grid;place-items:center;
  z-index:90;padding:1rem}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:1.6rem;
  max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.kv{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--line-soft);font-size:.93rem}
.kv span:first-child{color:var(--muted)}
.notice{background:var(--accent-soft);border:1px solid #eed49a;border-radius:8px;padding:.8rem 1rem;
  font-size:.9rem;color:#6b5208;margin-bottom:1rem}
.empty{text-align:center;color:var(--muted);padding:2.5rem 1rem}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="auth"></div>
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand"><span class="mark">CBT</span><span>CBT Platform</span></div>
    <div class="spacer"></div>
    <div class="who" id="whoami"></div>
    <button class="btn ghost sm" id="logoutBtn">Log out</button>
  </header>
  <main class="main" id="view"></main>
</div>
<div id="modalMount"></div>

/* ---------- QUANTITATIVE ---------- */
{scope:"COMMON",category:"Quantitative",type:"mcq",difficulty:"easy",
 stem:"A civil servant earns ₦180,000 per month. If 7.5% is deducted for pension, what is the monthly pension contribution?",
 options:["₦11,500","₦13,500","₦15,000","₦18,000"],answer:1,
 explanation:"7.5% of ₦180,000 = 0.075 × 180,000 = ₦13,500."},
{scope:"COMMON",category:"Quantitative",type:"mcq",difficulty:"medium",
 stem:"A file of 240 pages is shared equally among 8 officers to review. If 3 officers are absent, how many extra pages does each remaining officer review compared with the original plan?",
 options:["18 pages","12 pages","30 pages","10 pages"],answer:0,
 explanation:"Original: 240 ÷ 8 = 30 pages each. With 5 present: 240 ÷ 5 = 48 pages each. Extra = 48 − 30 = 18 pages."},
{scope:"COMMON",category:"Quantitative",type:"mcq",difficulty:"medium",
 stem:"The ratio of male to female staff in a unit is 5:3. If there are 40 staff in total, how many are female?",
 options:["25","15","24","12"],answer:1,
 explanation:"Total ratio parts = 5+3 = 8. Female share = 3/8 × 40 = 15."},
{scope:"COMMON",category:"Quantitative",type:"shortanswer",difficulty:"easy",
 stem:"What is 15% of ₦2,000? (Enter the amount in figures only, e.g. 300)",
 accept:["300","₦300","300.00"],
 explanation:"15% of 2,000 = 0.15 × 2,000 = 300."},
{scope:"COMMON",category:"Quantitative",type:"truefalse",difficulty:"easy",
 stem:"If an item costs ₦4,500 and is sold for ₦5,400, the profit percentage is 20%.",answer:true,
 explanation:"Profit = 5,400 − 4,500 = 900. Profit % = 900/4,500 × 100 = 20%."},
{scope:"COMMON",category:"Quantitative",type:"ordering",difficulty:"medium",
 stem:"Arrange these amounts from SMALLEST to LARGEST.",
 items:["₦45,000","₦120,500","₦340,000","₦1,050,000"],
 explanation:"Ordering by value: 45,000 < 120,500 < 340,000 < 1,050,000."},

{scope:"COMMON",category:"Qualitative",type:"mcq",difficulty:"easy",
 stem:"Choose the word most nearly SIMILAR in meaning to: DILIGENT",
 options:["Lazy","Hardworking","Careless","Late"],answer:1,
 explanation:"'Diligent' means showing careful and persistent effort — i.e. hardworking. The others are opposites or unrelated."},
{scope:"COMMON",category:"Qualitative",type:"mcq",difficulty:"medium",
 stem:"Choose the word OPPOSITE in meaning to: TRANSPARENT",
 options:["Clear","Honest","Opaque","Open"],answer:2,
 explanation:"'Transparent' means see-through/clear; its opposite is 'opaque' (not able to be seen through)."},
{scope:"COMMON",category:"Qualitative",type:"mcq",difficulty:"medium",

/* ---------- LOGIC ---------- */
{scope:"COMMON",category:"Logic",type:"mcq",difficulty:"easy",
 stem:"Find the next number in the series: 2, 6, 12, 20, 30, ___",
 options:["36","40","42","44"],answer:2,
 explanation:"Differences increase by 2 each time: +4, +6, +8, +10, then +12 → 30 + 12 = 42."},
{scope:"COMMON",category:"Logic",type:"mcq",difficulty:"medium",
 stem:"If all directors are officers, and some officers are auditors, which statement MUST be true?",
 options:["All auditors are directors","Some directors are auditors","All directors are officers","No officer is an auditor"],answer:2,
 explanation:"Only 'all directors are officers' is guaranteed by the premises. The links to auditors are only 'some', so nothing certain follows about directors and auditors."},
{scope:"COMMON",category:"Logic",type:"mcq",difficulty:"medium",
 stem:"In a code, OFFICE is written as PGGJDF (each letter moved one step forward). How is FILE written in the same code?",
 options:["GJMF","EHKD","GKMF","HJMF"],answer:0,
 explanation:"Shift each letter forward by one: F→G, I→J, L→M, E→F, giving GJMF."},
{scope:"COMMON",category:"Logic",type:"truefalse",difficulty:"medium",

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(tag,attrs={},...kids){const n=document.createElement(tag);
  for(const k in attrs){if(k==="class")n.className=attrs[k];
    else if(k==="html")n.innerHTML=attrs[k];
    else if(k.startsWith("on")&&typeof attrs[k]==="function")n.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!=null)n.setAttribute(k,attrs[k]);}
  kids.flat().forEach(c=>n.append(c?.nodeType?c:document.createTextNode(c)));return n;}
const uid=p=>(p||"id")+Math.random().toString(36).slice(2,9);
function hash(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h)+s.charCodeAt(i);h|=0}return "h"+(h>>>0).toString(36);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const norm=s=>String(s??"").trim().toLowerCase().replace(/[₦.,]/g,"").replace(/\s+/g," ");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg,kind=""){const t=el("div",{class:"toast "+kind},msg);document.body.append(t);
  setTimeout(()=>t.remove(),2600);}
function modal(node){const bg=el("div",{class:"modal-bg",onclick:e=>{if(e.target===bg)bg.remove();}});
  const m=el("div",{class:"modal"});m.append(node);bg.append(m);$("#modalMount").append(bg);
  return{close:()=>bg.remove()};}

/* ---------- DB ---------- */
const DB={
  k:{acc:"cbt_accounts",usr:"cbt_users",q:"cbt_questions",att:"cbt_attempts",cfg:"cbt_config",ses:"cbt_session"},
  _r(k,d){try{return JSON.parse(localStorage.getItem(k))??d;}catch{return d;}},
  _w(k,v){localStorage.setItem(k,JSON.stringify(v));},
  accounts(){return this._r(this.k.acc,[]);}, saveAccounts(a){this._w(this.k.acc,a);},
  users(){return this._r(this.k.usr,[]);}, saveUsers(u){this._w(this.k.usr,u);},
  questions(){return this._r(this.k.q,[]);}, saveQuestions(q){this._w(this.k.q,q);},
  attempts(){return this._r(this.k.att,[]);}, saveAttempts(a){this._w(this.k.att,a);},
  config(){return this._r(this.k.cfg,{});}, saveConfig(c){this._w(this.k.cfg,{...this.config(),...c});},
  session(){return this._r(this.k.ses,null);}, setSession(s){s?this._w(this.k.ses,s):localStorage.removeItem(this.k.ses);},
  seed(){
    const cfg=this.config();
    if(!cfg.seeded){
      const accs=this.accounts();
      if(!accs.some(a=>a.role==="super")){
        accs.push({id:uid("acc"),role:"super",username:"superadmin",
          passHash:hash("changeme123"),name:"System Super Admin",createdAt:Date.now(),mustChange:true});
        this.saveAccounts(accs);
      }
      const qs=this.questions();
      if(qs.length===0){
        this.saveQuestions(SEED_QUESTIONS.map(q=>({id:uid("q"),...q})));
      }
      this.saveConfig({seeded:true,examLength:20,durationMins:30,
        aiEndpoint:"https://api.anthropic.com/v1/messages",aiModel:"claude-sonnet-4-6",aiKey:""});
    }
  }
};

/* ---------- session / current actor ---------- */
let SESSION=null; // {kind:'staff'|'user', id, role}
function currentActor(){
  const s=DB.session(); if(!s)return null;
  if(s.kind==="staff"){const a=DB.accounts().find(x=>x.id===s.id);return a?{...a,kind:"staff"}:null;}
  const u=DB.users().find(x=>x.id===s.id);return u?{...u,role:"user",kind:"user"}:null;
}

function renderAuth(){

    if(!u||!p){toast("Enter your username and password","err");return;}
    const acc=DB.accounts().find(a=>a.username.toLowerCase()===u.toLowerCase());

}

/* ---------- APP SHELL ---------- */
function boot(){
  const actor=currentActor();
  if(!actor){renderAuth();return;}
  SESSION=actor;
  $("#auth").innerHTML="";
  $("#app").classList.remove("hidden");
  const roleLabel={super:"Super Admin",admin:"Admin",user:"Candidate"}[actor.role];
  $("#whoami").innerHTML=`<b>${esc(actor.name||actor.username)}</b>${roleLabel}`;
  $("#logoutBtn").onclick=()=>{DB.setSession(null);SESSION=null;renderAuth();};
  if(actor.role==="user")renderCandidate();
  else renderStaff();
}

/* ---------- EXAM ENGINE ---------- */
let EXAM=null;
function startExam(u){
  const cfg=DB.config();
  const pool=shuffle(userPool(u.cadre));
  const len=Math.min(cfg.examLength||20,pool.length);
  const picked=pool.slice(0,len).map(q=>{
    const m={id:q.id,category:q.category,type:q.type,stem:q.stem,explanation:q.explanation,difficulty:q.difficulty};
    if(q.type==="mcq"){m.options=q.options;m.answer=q.answer;}
    else if(q.type==="truefalse"){m.answer=q.answer;}
    else if(q.type==="shortanswer"){m.accept=q.accept;}
    else if(q.type==="ordering"){m.items=q.items;m.display=shuffle(q.items);}
    else if(q.type==="matching"){m.pairs=q.pairs;m.rights=shuffle(q.pairs.map(p=>p.r));}
    return m;
  });
  EXAM={user:u,cadre:u.cadre,questions:picked,responses:{},idx:0,
    startedAt:Date.now(),durationMins:cfg.durationMins||30,deadline:Date.now()+(cfg.durationMins||30)*60000};
  // init ordering responses to displayed order
  picked.forEach(q=>{if(q.type==="ordering")EXAM.responses[q.id]=q.display.slice();
    if(q.type==="matching")EXAM.responses[q.id]={};});
  renderExam();
}

function renderExam(){
  const view=$("#view");view.innerHTML="";
  const q=EXAM.questions[EXAM.idx];
  const total=EXAM.questions.length;
  const answeredCount=EXAM.questions.filter(x=>isAnswered(x)).length;
  const timer=el("span",{class:"timer",id:"examTimer"},"—");
  const head=el("div",{class:"exam-head"},
    el("div",{style:"flex:1"},
      el("div",{style:"font-weight:700;font-size:1.05rem"},`Question ${EXAM.idx+1} of ${total}`),
      el("div",{style:"color:var(--muted);font-size:.9rem"},q.category+" · "+(TYPES.find(t=>t.id===q.type)?.label||q.type))),
    timer);
  const palette=el("div",{class:"qpalette"},
    ...EXAM.questions.map((x,i)=>el("button",{
      class:"qdot"+(isAnswered(x)?" answered":"")+(i===EXAM.idx?" current":""),
      onclick:()=>{EXAM.idx=i;renderExam();}},i+1)));
  const qBox=el("div",{class:"card"},el("div",{class:"qstem"},q.stem),renderQuestionInput(q));
  const nav=el("div",{class:"row",style:"margin-top:.5rem"},
    el("button",{class:"btn sec",disabled:EXAM.idx===0?"":null,onclick:()=>{EXAM.idx--;renderExam();}},"‹ Previous"),
    EXAM.idx<total-1
      ? el("button",{class:"btn",onclick:()=>{EXAM.idx++;renderExam();}},"Next ›")
      : el("button",{class:"btn warn",onclick:()=>confirmSubmit()},"Submit session"));
  const progress=el("div",{class:"progress",style:"margin-bottom:1rem"},
    el("div",{class:"fill",style:`width:${Math.round(answeredCount/total*100)}%`}));
  view.append(el("div",{class:"card"},head,palette),progress,qBox,nav,
    el("div",{style:"text-align:center;margin-top:1rem"},
      el("button",{class:"btn danger sm",onclick:()=>confirmSubmit()},"Submit & see my results")));
  tickTimer();
}
let timerHandle=null;
function tickTimer(){
  if(timerHandle)clearInterval(timerHandle);
  const upd=()=>{const t=$("#examTimer");if(!t||!EXAM)return;
    let left=Math.max(0,Math.floor((EXAM.deadline-Date.now())/1000));
    const m=String(Math.floor(left/60)).padStart(2,"0"),s=String(left%60).padStart(2,"0");
    t.textContent=`${m}:${s}`;t.classList.toggle("low",left<=60);
    if(left<=0){clearInterval(timerHandle);toast("Time is up — submitting","err");gradeAndReview();}};
  upd();timerHandle=setInterval(upd,1000);
}
function isAnswered(q){
  const r=EXAM.responses[q.id];
  if(q.type==="mcq")return typeof r==="number";
  if(q.type==="truefalse")return typeof r==="boolean";
  if(q.type==="shortanswer")return r&&r.trim().length>0;
  if(q.type==="ordering")return Array.isArray(r);
  if(q.type==="matching")return r&&Object.keys(r).length===q.pairs.length;
  return false;
}
function renderQuestionInput(q){
  const r=EXAM.responses[q.id];
  if(q.type==="mcq"){
    return el("div",{},...q.options.map((o,i)=>

function gradeQuestion(q){
  const r=EXAM.responses[q.id];
  if(q.type==="mcq")return r===q.answer;
  if(q.type==="truefalse")return r===q.answer;
  if(q.type==="shortanswer")return !!r&&q.accept.map(norm).includes(norm(r));
  if(q.type==="ordering")return Array.isArray(r)&&JSON.stringify(r)===JSON.stringify(q.items);
  if(q.type==="matching")return r&&q.pairs.every(p=>r[p.l]===p.r);
  return false;
}
function gradeAndReview(){
  if(timerHandle)clearInterval(timerHandle);
  const per=EXAM.questions.map(q=>({qid:q.id,category:q.category,type:q.type,correct:gradeQuestion(q),
    given:EXAM.responses[q.id],stem:q.stem,explanation:q.explanation,
    answerKey:answerKeyText(q)}));
  const score=per.filter(p=>p.correct).length,total=per.length;
  const attempt={id:uid("att"),userId:EXAM.user.id,cadre:EXAM.cadre,startedAt:EXAM.startedAt,
    endedAt:Date.now(),score,total,pct:Math.round(score/total*100),per};
  const all=DB.attempts();all.push(attempt);DB.saveAttempts(all);
  EXAM=null;renderReview(attempt,true);
}
function answerKeyText(q){
  if(q.type==="mcq")return q.options[q.answer];
  if(q.type==="truefalse")return q.answer?"True":"False";
  if(q.type==="shortanswer")return q.accept[0];
  if(q.type==="ordering")return q.items.join("  →  ");
  if(q.type==="matching")return q.pairs.map(p=>`${p.l} = ${p.r}`).join("; ");
  return "";
}
function givenText(p){
  const g=p.given;
  if(p.type==="ordering")return Array.isArray(g)?g.join("  →  "):"(no answer)";
  if(p.type==="matching")return g&&Object.keys(g).length?Object.entries(g).map(([l,r])=>`${l} = ${r||"?"}`).join("; "):"(no answer)";
  if(p.type==="truefalse")return typeof g==="boolean"?(g?"True":"False"):"(no answer)";
  if(p.type==="mcq")return typeof g==="number"?String.fromCharCode(65+g):"(no answer)";
  return g&&String(g).trim()?g:"(no answer)";
}

/* ---------- ANALYTICS (shared) ---------- */
function categoryStats(attempts){
  const acc={};CATEGORIES.forEach(c=>acc[c]={correct:0,total:0});
  attempts.forEach(a=>a.per.forEach(p=>{if(!acc[p.category])acc[p.category]={correct:0,total:0};
    acc[p.category].total++;if(p.correct)acc[p.category].correct++;}));
  return acc;
}
function catBars(acc){
  const items=CATEGORIES.filter(c=>acc[c]&&acc[c].total>0).map(c=>{
    const pct=Math.round(acc[c].correct/acc[c].total*100);
    return el("div",{class:"item"},
      el("div",{class:"lab"},c),
      el("div",{class:"track"},el("div",{class:"bar",style:`width:${pct}%;background:${CAT_COLORS[c]||"#0e4d6b"}`})),
      el("div",{class:"pct"},pct+"%"));
  });
  return items.length?el("div",{class:"catbar"},...items):el("div",{class:"empty"},"No data yet.");
}
function trendSVG(attempts){
  const pts=attempts.map(a=>a.pct);if(pts.length<1)return el("div",{class:"empty"},"No sessions yet.");
  const W=520,H=160,pad=28;const n=pts.length;
  const x=i=>n===1?W/2:pad+i*(W-2*pad)/(n-1);const y=v=>H-pad-(v/100)*(H-2*pad);
  const path=pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("width","100%");
  [0,50,100].forEach(g=>{const ln=document.createElementNS(ns,"line");
    ln.setAttribute("x1",pad);ln.setAttribute("x2",W-pad);ln.setAttribute("y1",y(g));ln.setAttribute("y2",y(g));
    ln.setAttribute("stroke",g===50?"#c9d3da":"#e8edf1");ln.setAttribute("stroke-dasharray",g===50?"4 4":"");svg.append(ln);
    const tx=document.createElementNS(ns,"text");tx.setAttribute("x",4);tx.setAttribute("y",y(g)+4);
    tx.setAttribute("font-size","10");tx.setAttribute("fill","#5b6b78");tx.textContent=g;svg.append(tx);});
  const pth=document.createElementNS(ns,"path");pth.setAttribute("d",path);pth.setAttribute("fill","none");
  pth.setAttribute("stroke","#0e4d6b");pth.setAttribute("stroke-width","2.5");svg.append(pth);
  pts.forEach((v,i)=>{const c=document.createElementNS(ns,"circle");c.setAttribute("cx",x(i));c.setAttribute("cy",y(v));
    c.setAttribute("r","4");c.setAttribute("fill",v>=50?"#1f7a54":"#b23a3a");svg.append(c);});
  return svg;
}
function candidateOverview(u){
  const atts=userAttempts(u.id);
  if(!atts.length)return el("div",{class:"card"},el("div",{class:"empty"},
    el("p",{},"No results yet."),el("button",{class:"btn",onclick:()=>renderCandidateHome("practice")},"Start your first session")));
  const avg=Math.round(atts.reduce((s,a)=>s+a.pct,0)/atts.length);
  const best=Math.max(...atts.map(a=>a.pct));
  const acc=categoryStats(atts);
  const withData=CATEGORIES.filter(c=>acc[c].total>0);
  const weakest=withData.slice().sort((a,b)=>(acc[a].correct/acc[a].total)-(acc[b].correct/acc[b].total))[0];
  const wrap=el("div",{});
  wrap.append(el("div",{class:"grid cols3"},
    el("div",{class:"card stat"},el("div",{class:"n"},atts.length),el("div",{class:"l"},"Sessions completed")),
    el("div",{class:"card stat"},el("div",{class:"n"},avg+"%"),el("div",{class:"l"},"Average score")),
    el("div",{class:"card stat"},el("div",{class:"n"},best+"%"),el("div",{class:"l"},"Best score"))));
  if(weakest){
    const wp=Math.round(acc[weakest].correct/acc[weakest].total*100);
    wrap.append(el("div",{class:"notice"},el("b",{},"Focus area: "),
      `Your weakest subject is ${weakest} (${wp}% correct). Target this area in your next sessions to lift your overall score.`));
  }
  wrap.append(el("div",{class:"card"},el("h2",{},"Accuracy by subject"),catBars(acc)));
  wrap.append(el("div",{class:"card"},el("h2",{},"Score trend"),
    el("p",{style:"color:var(--muted);font-size:.9rem;margin-top:-.3rem"},"Each point is one session, oldest to newest. The dashed line is the 50% pass mark."),
    trendSVG(atts)));
  return wrap;
}

          const qs=DB.questions();qs.push({id:uid("q"),...q});DB.saveQuestions(qs);
          m.close();toast("Question added","ok");renderStaff("bank");
        }catch(e){toast(e.message,"err");}

function buildQuestionFromForm(category,type,scope,difficulty,stemV,explainV){
  const stem=stemV.trim();if(!stem)throw new Error("Question text is required");
  const q={scope,category,type,difficulty,stem,explanation:explainV.trim()};
  if(type==="mcq"){
    const lines=$("#aq_opts").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(lines.length<2)throw new Error("Give at least two options");
    const ans=lines.findIndex(l=>l.startsWith("*"));if(ans<0)throw new Error("Mark the correct option with a leading *");
    q.options=lines.map(l=>l.replace(/^\*/,"").trim());q.answer=ans;
  }else if(type==="truefalse")q.answer=$("#aq_tf").value==="true";
  else if(type==="shortanswer"){q.accept=$("#aq_acc").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!q.accept.length)throw new Error("Give at least one accepted answer");}
  else if(type==="ordering"){q.items=$("#aq_items").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(q.items.length<2)throw new Error("Give at least two items");}
  else if(type==="matching"){q.pairs=$("#aq_pairs").value.split("\n").map(s=>s.trim()).filter(Boolean)
      .map(l=>{const i=l.indexOf("=");if(i<0)throw new Error("Each pair needs an = sign");
        return{l:l.slice(0,i).trim(),r:l.slice(i+1).trim()};});
    if(!q.pairs.length)throw new Error("Give at least one pair");}
  return q;
}

function parseCSV(text){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===","){row.push(cur);cur="";}
      else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur="";}
      else cur+=c;}}
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function importCSV(text){
  const rows=parseCSV(text.trim());if(rows.length<2)throw new Error("No data rows found");
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const ix=n=>head.indexOf(n);
  const need=["scope","category","type","stem"];for(const n of need)if(ix(n)<0)throw new Error("Missing column: "+n);
  const out=[];
  for(let r=1;r<rows.length;r++){const row=rows[r];const g=n=>ix(n)>=0?(row[ix(n)]||"").trim():"";
    const type=g("type").toLowerCase();const scope=g("scope")||"COMMON";
    const category=CATEGORIES.find(c=>c.toLowerCase()===g("category").toLowerCase())||g("category");
    if(!CATEGORIES.includes(category))throw new Error(`Row ${r+1}: unknown category "${g("category")}"`);
    const q={scope,category,type,stem:g("stem"),explanation:g("explanation"),difficulty:g("difficulty")||"medium"};
    const opts=g("options"),ans=g("answer");
    if(type==="mcq"){q.options=opts.split("|").map(s=>s.trim()).filter(Boolean);
      let a=q.options.findIndex(o=>o.toLowerCase()===ans.toLowerCase());
      if(a<0&&/^\d+$/.test(ans))a=parseInt(ans,10);
      if(a<0||a>=q.options.length)throw new Error(`Row ${r+1}: answer must match an option or be a valid index`);
      q.answer=a;}
    else if(type==="truefalse")q.answer=/^t|true|1|yes$/i.test(ans);
    else if(type==="shortanswer")q.accept=ans.split("|").map(s=>s.trim()).filter(Boolean);
    else if(type==="ordering")q.items=opts.split("|").map(s=>s.trim()).filter(Boolean);
    else if(type==="matching")q.pairs=opts.split("|").map(s=>s.trim()).filter(Boolean)
      .map(p=>{const i=p.indexOf("=");return{l:p.slice(0,i).trim(),r:p.slice(i+1).trim()};});
    else throw new Error(`Row ${r+1}: unknown type "${type}"`);
    if(!q.stem)throw new Error(`Row ${r+1}: missing stem`);
    out.push({id:uid("q"),...q});}
  const qs=DB.questions();qs.push(...out);DB.saveQuestions(qs);return out.length;
}

          const qs=DB.questions();qs.push(...items.map(q=>({id:uid("q"),...q})));DB.saveQuestions(qs);
          status.innerHTML=`<span style="color:var(--success)">Added ${items.length} question(s).</span>`;

async function aiGenerate(category,type,scope,count,difficulty){
  const cfg=DB.config();
  if(!cfg.aiKey)throw new Error("Set an API key in Settings first.");
  const schema={mcq:'{"type":"mcq","stem":"...","options":["a","b","c","d"],"answer":0,"explanation":"..."}',
    truefalse:'{"type":"truefalse","stem":"...","answer":true,"explanation":"..."}',
    shortanswer:'{"type":"shortanswer","stem":"...","accept":["ans1","ans2"],"explanation":"..."}',
    ordering:'{"type":"ordering","stem":"...","items":["first","second","third"],"explanation":"..."}',
    matching:'{"type":"matching","stem":"...","pairs":[{"l":"term","r":"meaning"}],"explanation":"..."}'}[type];
  const prompt=`Generate ${count} ${difficulty==="mixed"?"":difficulty+" difficulty"} practice questions for a Lagos State (Nigeria) civil service promotion exam.
Subject: ${category}. Question type: ${type}.
Return ONLY a JSON array, no prose, no markdown fences. Each element must match exactly this shape:
${schema}
For ordering, list items in the CORRECT order. For matching, l is the prompt and r is its correct match. Every question must include a clear "explanation".`;
  const res=await fetch(cfg.aiEndpoint,{method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":cfg.aiKey,
      "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:cfg.aiModel||"claude-sonnet-4-6",max_tokens:2000,
      messages:[{role:"user",content:prompt}]})});
  if(!res.ok)throw new Error("API error "+res.status+" — check key/endpoint/CORS");
  const data=await res.json();
  let txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  txt=txt.replace(/^```json\s*|\s*```$/g,"").trim();
  let arr;try{arr=JSON.parse(txt);}catch{throw new Error("Model did not return valid JSON");}
  if(!Array.isArray(arr))arr=[arr];
  return arr.map(q=>({scope,category,type,difficulty:difficulty==="mixed"?"medium":difficulty,
    stem:q.stem,explanation:q.explanation||"",
    ...(type==="mcq"?{options:q.options,answer:q.answer}:{}),
    ...(type==="truefalse"?{answer:!!q.answer}:{}),
    ...(type==="shortanswer"?{accept:q.accept||[]}:{}),
    ...(type==="ordering"?{items:q.items||[]}:{}),
    ...(type==="matching"?{pairs:q.pairs||[]}:{})})).filter(q=>q.stem);
}
